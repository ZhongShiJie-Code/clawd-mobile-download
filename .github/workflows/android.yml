name: Android Quality Gate

on:
  push:
    branches: [main]
    paths: ['android/**', 'scripts/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'scripts/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint, focused regression tests, and build
        run: bash scripts/build-mobile.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-and-lint-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: ci-debug-not-upgrade-compatible
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
